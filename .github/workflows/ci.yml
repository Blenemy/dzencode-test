name: CI

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Форматирование
        run: npm run format:check

      - name: Линтер
        run: npm run lint

      - name: Типы
        run: npm run typecheck

      - name: Unit-тесты web
        run: npm run test:web

      - name: Сборка
        run: npm run build

  api-tests:
    name: API integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: inventory_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30

    env:
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/inventory_test?allowPublicKeyRetrieval=true

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать shared
        run: npm run build -w @dzen/shared

      - name: Тесты api
        run: npm run test:api

  e2e:
    name: E2E (Playwright)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Поднять стек в Docker
        run: |
          cp .env.example .env
          docker compose up -d --build --wait

      - name: Установить Chromium
        run: npx playwright install --with-deps chromium

      - name: Прогнать e2e
        run: npm run test:e2e

      - name: Логи стека
        if: failure()
        run: docker compose logs --tail 100

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
