name: dzen-inventory

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile
  target: runtime

x-api-image: &api-image ${IMAGE_REGISTRY:-ghcr.io/blenemy}/dzen-inventory-api:${IMAGE_TAG:-latest}

x-database-url: &database-url mysql://${MYSQL_USER:-inventory}:${MYSQL_PASSWORD:?нужен MYSQL_PASSWORD}@mysql:3306/${MYSQL_DATABASE:-inventory}?allowPublicKeyRetrieval=true

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    command:
      - --innodb-buffer-pool-size=128M
      - --performance-schema=OFF
      - --skip-name-resolve
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?нужен MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-inventory}
      MYSQL_USER: ${MYSQL_USER:-inventory}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?нужен MYSQL_PASSWORD}
    ports:
      - '127.0.0.1:${MYSQL_HOST_PORT:-3307}:3306'
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot -p"$$MYSQL_ROOT_PASSWORD" --silent']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  migrate:
    image: *api-image
    build: *api-build
    restart: 'no'
    command: ['npx', 'prisma', 'migrate', 'deploy']
    environment:
      DATABASE_URL: *database-url
    depends_on:
      mysql:
        condition: service_healthy

  api:
    image: *api-image
    build: *api-build
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 4000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: *database-url
      CORS_ORIGIN: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-1}
      APP_VERSION: ${IMAGE_TAG:-local}
    volumes:
      - uploads:/app/apps/api/uploads
    depends_on:
      mysql:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:4000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/blenemy}/dzen-inventory-web:${IMAGE_TAG:-latest}
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:4000
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  gateway:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:${GATEWAY_PORT:-8080}:80'
    volumes:
      - ./docker/gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - uploads:/srv/uploads:ro
    depends_on:
      - api
      - web

volumes:
  mysql-data:
  uploads:
